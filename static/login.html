<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — YouTube Clipper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 rounded-lg p-8 w-full max-w-sm">
        <h1 class="text-2xl font-bold text-center mb-6">🎬 YouTube Clipper</h1>
        
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    class="w-full px-4 py-2 bg-gray-700 rounded-lg border border-gray-600 focus:border-blue-500 focus:outline-none"
                    required
                >
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="w-full px-4 py-2 bg-gray-700 rounded-lg border border-gray-600 focus:border-blue-500 focus:outline-none"
                    required
                >
            </div>
            
            <p id="loginError" class="text-red-400 text-sm mb-4 hidden"></p>
            
            <button 
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-semibold transition"
            >
                Login
            </button>
        </form>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Login gagal');
                }
                
                const data = await res.json();
                
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('is_admin', data.is_admin);
                
                if (data.is_admin) {
                    window.location.href = '/menu.html';
                } else {
                    window.location.href = '/index.html';
                }
            } catch (error) {
                const el = document.getElementById('loginError');
                el.textContent = error.message;
                el.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
